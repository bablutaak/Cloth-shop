    <style>
        /* ============================================
           CSS VARIABLES & RESET
           ============================================ */
        :root {
            --gold: #D4AF37;
            --gold-dark: #B8860B;
            --gold-light: #F9F1D8;
            --cream: #FDFBF7;
            --white: #FFFFFF;
            --dark: #2C2C2C;
            --text-muted: #6B6B6B;
            --border-light: #E8E0D5;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.04);
            --shadow-md: 0 8px 30px rgba(0,0,0,0.06);
            --shadow-lg: 0 15px 50px rgba(0,0,0,0.1);
            --radius-sm: 8px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            --font-heading: 'Playfair Display', serif;
            --font-body: 'Inter', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; scroll-padding-top: 100px; }
        body {
            font-family: var(--font-body);
            background-color: var(--white);
            color: var(--dark);
            line-height: 1.6;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }
        h1, h2, h3, h4, h5, h6 { font-family: var(--font-heading); font-weight: 600; color: var(--dark); line-height: 1.3; }
        a { text-decoration: none; color: inherit; transition: var(--transition); }
        ul { list-style: none; }
        img { max-width: 100%; display: block; }
        button { cursor: pointer; font-family: var(--font-body); border: none; outline: none; transition: var(--transition); }
        .container { width: 100%; max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        .section-padding { padding: 80px 0; }
        .text-center { text-align: center; }

        /* ============================================
           ANNOUNCEMENT BAR
           ============================================ */
        .announcement-bar {
            background: linear-gradient(90deg, var(--gold-dark), var(--gold), var(--gold-dark));
            color: var(--white);
            font-size: 0.75rem;
            font-weight: 500;
            padding: 8px 0;
            text-align: center;
        }
        .announcement-bar span { margin: 0 10px; }
        .announcement-bar i { margin-right: 4px; }

        /* ============================================
           NAVIGATION
           ============================================ */
        .navbar {
            position: sticky;
            top: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-light);
            z-index: 1000;
            transition: var(--transition);
        }
        .navbar.scrolled { box-shadow: var(--shadow-md); }
        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 72px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        .nav-logo { display: flex; align-items: center; gap: 10px; }
        .nav-logo svg { height: 44px; width: auto; }
        .nav-logo-text { display: flex; flex-direction: column; line-height: 1.1; }
        .nav-logo-text .brand-name {
            font-family: var(--font-heading);
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--gold-dark);
            letter-spacing: 0.5px;
        }
        .nav-logo-text .brand-sub {
            font-size: 0.6rem;
            color: var(--text-muted);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-weight: 500;
        }
        .nav-links { display: flex; align-items: center; gap: 24px; }
        .nav-links a {
            font-size: 0.82rem;
            font-weight: 500;
            color: var(--dark);
            position: relative;
            padding: 4px 0;
        }
        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--gold);
            transition: var(--transition);
        }
        .nav-links a:hover::after, .nav-links a.active::after { width: 100%; }
        .nav-links a:hover, .nav-links a.active { color: var(--gold-dark); }
        .nav-cta {
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: var(--white) !important;
            padding: 10px 24px !important;
            border-radius: 50px;
            font-size: 0.8rem !important;
            font-weight: 600 !important;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }
        .nav-cta:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(212, 175, 55, 0.45); }
        .nav-cta::after { display: none !important; }
        .hamburger { display: none; flex-direction: column; gap: 5px; background: none; padding: 5px; }
        .hamburger span { display: block; width: 26px; height: 2px; background: var(--dark); border-radius: 2px; transition: var(--transition); }
        .hamburger.active span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
        .hamburger.active span:nth-child(2) { opacity: 0; }
        .hamburger.active span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

        /* ============================================
           HERO SECTION (Page 1)
           ============================================ */
        .hero {
            position: relative;
            background: linear-gradient(135deg, var(--cream) 0%, var(--white) 50%, var(--gold-light) 100%);
            padding: 80px 0 60px;
            overflow: hidden;
        }
        .hero::before {
            content: '';
            position: absolute;
            top: -50%; right: -20%;
            width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.08) 0%, transparent 70%);
            border-radius: 50%;
        }
        .hero-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: center;
            position: relative;
            z-index: 1;
        }
        .hero-content { animation: fadeInUp 0.8s ease-out; }
        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--white);
            border: 1px solid var(--border-light);
            padding: 8px 18px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--gold-dark);
            margin-bottom: 24px;
            box-shadow: var(--shadow-sm);
        }
        .hero h1 { font-size: clamp(2.2rem, 5vw, 3.5rem); margin-bottom: 20px; line-height: 1.15; }
        .hero h1 .gold-text {
            background: linear-gradient(135deg, var(--gold-dark), var(--gold), #E8C84A);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .hero p { font-size: 1.05rem; color: var(--text-muted); max-width: 520px; margin-bottom: 32px; line-height: 1.7; }
        .hero-buttons { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 40px; }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 30px;
            border-radius: 50px;
            font-size: 0.88rem;
            font-weight: 600;
            transition: var(--transition);
            border: 2px solid transparent;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: var(--white);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.35);
        }
        .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(212, 175, 55, 0.5); }
        .btn-outline {
            background: transparent;
            color: var(--dark);
            border-color: var(--gold);
        }
        .btn-outline:hover { background: var(--gold); color: var(--white); transform: translateY(-3px); }
        .hero-image {
            width: 100%;
            max-width: 450px;
            aspect-ratio: 4/5;
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-lg);
            object-fit: cover;
            animation: fadeInUp 1s ease-out 0.2s both;
        }

        /* ============================================
           ABOUT (Page 2)
           ============================================ */
        .about-section { background: var(--cream); }
        .about-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 60px; align-items: center; }
        .about-image {
            width: 100%;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            object-fit: cover;
            aspect-ratio: 4/5;
        }
        .about-content h2 { font-size: clamp(1.8rem, 3.5vw, 2.4rem); margin-bottom: 20px; }
        .about-content p { color: var(--text-muted); margin-bottom: 16px; font-size: 0.95rem; line-height: 1.8; }
        .about-points { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 28px; }
        .about-point { display: flex; align-items: flex-start; gap: 12px; }
        .about-point i { color: var(--gold); font-size: 1rem; margin-top: 3px; }
        .about-point span { font-size: 0.85rem; font-weight: 500; color: var(--dark); }

        /* ============================================
           TREATMENTS (Page 3)
           ============================================ */
        .treatments-section { background: var(--white); }
        .section-header { text-align: center; max-width: 700px; margin: 0 auto 50px; }
        .section-header .subtitle {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--gold-dark);
            margin-bottom: 14px;
        }
        .section-header .subtitle::before, .section-header .subtitle::after {
            content: '';
            width: 30px;
            height: 1px;
            background: var(--gold);
        }
        .section-header h2 { font-size: clamp(1.8rem, 4vw, 2.6rem); margin-bottom: 16px; }
        .section-header p { font-size: 0.95rem; color: var(--text-muted); line-height: 1.7; }
        .treatments-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; }
        .treatment-card {
            background: var(--cream);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            padding: 32px 28px;
            transition: var(--transition);
            text-align: center;
        }
        .treatment-card:hover {
            background: var(--white);
            transform: translateY(-6px);
            box-shadow: var(--shadow-lg);
            border-color: rgba(212, 175, 55, 0.3);
        }
        .treatment-icon {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 1.4rem;
            color: var(--white);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.3);
        }
        .treatment-card h4 { font-size: 1.05rem; margin-bottom: 10px; }
        .treatment-card p { font-size: 0.82rem; color: var(--text-muted); line-height: 1.6; margin-bottom: 16px; }
        .treatment-card .btn-sm {
            padding: 8px 20px;
            font-size: 0.75rem;
            border-radius: 50px;
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: var(--white);
            border: none;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .treatment-card .btn-sm:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(212, 175, 55, 0.4); }

        /* ============================================
           GALLERY / BEFORE & AFTER (Page 4)
           ============================================ */
        .gallery-section { background: var(--cream); }
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; }
        .gallery-card {
            border-radius: var(--radius-md);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            background: var(--white);
            transition: var(--transition);
        }
        .gallery-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); }
        .gallery-card img { width: 100%; height: 220px; object-fit: cover; }
        .gallery-info { padding: 16px 20px; text-align: center; }
        .gallery-info h4 { font-size: 0.9rem; margin-bottom: 4px; }
        .gallery-info p { font-size: 0.75rem; color: var(--text-muted); }

        /* ============================================
           BOOKING (Page 5)
           ============================================ */
        .booking-section { background: linear-gradient(135deg, var(--gold-light) 0%, var(--cream) 100%); }
        .booking-container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--white);
            border-radius: var(--radius-lg);
            padding: 40px;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-light);
        }
        .booking-form { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group.full-width { grid-column: 1 / -1; }
        .form-group label { font-size: 0.78rem; font-weight: 600; color: var(--dark); }
        .form-group label .required { color: #e74c3c; }
        .form-group input, .form-group select, .form-group textarea {
            padding: 12px 16px;
            border: 1px solid var(--border-light);
            border-radius: var(--radius-sm);
            font-family: var(--font-body);
            font-size: 0.88rem;
            color: var(--dark);
            background: var(--cream);
            transition: var(--transition);
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none;
            border-color: var(--gold);
            background: var(--white);
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.1);
        }
        .form-group textarea { resize: vertical; min-height: 80px; }
        .error-message { font-size: 0.7rem; color: #e74c3c; display: none; }
        .error-message.show { display: block; }
        .booking-actions { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; margin-top: 10px; }
        .booking-note {
            grid-column: 1 / -1;
            font-size: 0.72rem;
            color: var(--text-muted);
            text-align: center;
            margin-top: 10px;
            padding-top: 15px;
            border-top: 1px solid var(--border-light);
        }

        /* ============================================
           CONTACT / FOOTER (Page 6)
           ============================================ */
        .contact-section { background: var(--white); }
        .contact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
        .contact-info { display: flex; flex-direction: column; gap: 24px; }
        .contact-item { display: flex; gap: 18px; align-items: flex-start; }
        .contact-item-icon {
            min-width: 48px; height: 48px;
            border-radius: 12px;
            background: var(--gold-light);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gold-dark);
            font-size: 1.1rem;
        }
        .contact-item h4 { font-size: 0.95rem; margin-bottom: 4px; }
        .contact-item p { font-size: 0.85rem; color: var(--text-muted); line-height: 1.6; }
        .contact-item a { color: var(--gold-dark); font-weight: 600; }
        .map-placeholder {
            background: var(--cream);
            border-radius: var(--radius-md);
            height: 100%;
            min-height: 300px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            border: 1px solid var(--border-light);
            color: var(--text-muted);
            font-size: 0.85rem;
            padding: 20px;
            text-align: center;
        }
        .map-placeholder i { font-size: 3rem; color: var(--gold); opacity: 0.4; }

        .footer {
            background: var(--dark);
            color: #B0B0B0;
            padding: 60px 0 30px;
        }
        .footer-grid { display: grid; grid-template-columns: 1.5fr 1fr 1fr 1.5fr; gap: 40px; margin-bottom: 40px; }
        .footer-brand { display: flex; flex-direction: column; gap: 16px; }
        .footer-brand svg { width: 60px; height: auto; }
        .footer-brand h4 { color: var(--white); font-size: 1.1rem; margin-bottom: 4px; }
        .footer-brand p { font-size: 0.8rem; line-height: 1.7; color: #999; }
        .footer h5 { color: var(--white); font-size: 0.9rem; margin-bottom: 20px; font-weight: 600; }
        .footer-links { display: flex; flex-direction: column; gap: 10px; }
        .footer-links a { font-size: 0.8rem; color: #999; }
        .footer-links a:hover { color: var(--gold); padding-left: 4px; }
        .footer-contact { display: flex; flex-direction: column; gap: 12px; }
        .footer-contact-item {
